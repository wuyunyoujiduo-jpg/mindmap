name: Build

# Every push runs the tests. The macOS app, which takes macOS runner
# minutes, is built only for a tag such as v0.1.0, which publishes a
# release with the disk image, or when run by hand from the Actions tab,
# which keeps it as an artifact of the run.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating the release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag matches the version in mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Build MindMap.app and the disk image
        run: go tool mygo build -platform darwin/universal
      - uses: actions/upload-artifact@v7
        with:
          name: MindMap-macOS
          path: build/*/*.dmg
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*/*.dmg \
            --repo "$GITHUB_REPOSITORY" --title "MindMap $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes
