name: Build

# Every push runs the tests. The macOS app, which takes macOS runner
# minutes, is built only for a tag such as v0.1.0, which publishes a
# release with the disk image, or when run by hand from the Actions tab,
# which keeps it as an artifact of the run, or with "release" checked
# publishes the release of mygo.json's version, creating its tag.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "发布 Release（版本号取自 mygo.json，并创建同名标签）"
        type: boolean
        default: false

permissions:
  contents: write # creating the release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The built-in embedding model, made by the Embedding model workflow,
      # and what Model2Vec gives, which the tests compare against.
      - name: Get the built-in embedding model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download embed-model --repo "$GITHUB_REPOSITORY" -p mindmap-embed.bin -p reference.json -D "$RUNNER_TEMP/embed"
      - run: go test ./...
        env:
          MINDMAP_EMBED_MODEL: ${{ runner.temp }}/embed/mindmap-embed.bin
          MINDMAP_EMBED_REF: ${{ runner.temp }}/embed/reference.json

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag matches the version in mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # With a Developer ID certificate in the repository's secrets, the app
      # is signed and the disk image notarized, so that macOS opens it
      # without asking; without, it is signed ad hoc, as before.
      #   APPLE_CERTIFICATE           the .p12 of "Developer ID Application", in base64
      #   APPLE_CERTIFICATE_PASSWORD  its password
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID     the Apple account and team
      #   APPLE_APP_PASSWORD          an app-specific password of the account
      - name: Set up signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing certificate: the app is signed ad hoc."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials mindmap-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
          jq --arg kc "$kc" '.macos.notarize = {keychainProfile: "mindmap-notary", keychain: $kc}' mygo.json > mygo.signed.json
          mv mygo.signed.json mygo.json
          echo "SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      # The semantic search model, until it is downloaded on demand from
      # mindmap-models (see plugin.go): the app takes it from its resources.
      - name: Get the embedding model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download embed-model --repo "$GITHUB_REPOSITORY" -p mindmap-embed.bin -D resources --clobber
      - name: Build MindMap.app and the disk image
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            go tool mygo build -platform darwin/universal -sign "$SIGN_IDENTITY"
          else
            go tool mygo build -platform darwin/universal
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: MindMap-macOS
          path: build/*/*.dmg
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release create "$tag" build/*/*.dmg --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "MindMap $tag" \
            --notes-file .github/release-notes.md --generate-notes

  # The Windows app and its installer, made on Windows (NSIS), added to the
  # release the macOS job publishes.
  windows:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get the embedding model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download embed-model --repo "$GITHUB_REPOSITORY" -p mindmap-embed.bin -D resources --clobber
      - name: Build MindMap.exe and the installer
        run: go tool mygo build -platform windows/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: MindMap-Windows
          path: build/windows-amd64/*.exe
      - name: Add the installer to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release upload "$tag" build/windows-amd64/*Setup*.exe --repo "$GITHUB_REPOSITORY" --clobber
