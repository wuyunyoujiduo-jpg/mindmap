name: Build

# Every push runs the tests. The macOS app, which takes macOS runner
# minutes, is built only for a tag such as v0.1.0, which publishes a
# release with the disk image, or when run by hand from the Actions tab,
# which keeps it as an artifact of the run, or with "release" checked
# publishes the release of mygo.json's version, creating its tag.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "发布 Release（版本号取自 mygo.json，并创建同名标签）"
        type: boolean
        default: false
      all:
        description: "也打 Intel Mac 和 Windows 的包（默认只打 Apple 芯片的 Mac 包）"
        type: boolean
        default: false

permissions:
  contents: write # creating the release

# Auto-updates (mygo.json's updates): with these secrets, releases also
# sign the update files and publish them to the public repository
# mindmap-models: to its release desktop-latest, whose files the app reads
# from github.com with no API call (mygo.json's updates.url), and, for the
# versions before 0.30.1, which look through the API for the newest
# desktop-v<version> release, to that release too.
#   MYGO_UPDATER_PRIVATE_KEY  the key that signs updates (mygo-update.key)
#   RELEASES_TOKEN            a token that may write mindmap-models'
#                             releases (fine-grained: Contents read/write)
# They are secrets of the environment mymind, which the build jobs use.
env:
  UPDATES_REPO: wuyunyoujiduo-jpg/mindmap-models
  RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The built-in embedding model, made by the Embedding model workflow,
      # and what Model2Vec gives, which the tests compare against.
      - name: Get the built-in embedding model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download embed-model --repo "$GITHUB_REPOSITORY" -p mindmap-embed.bin -p reference.json -D "$RUNNER_TEMP/embed"
      - run: go test ./...
        env:
          MINDMAP_EMBED_MODEL: ${{ runner.temp }}/embed/mindmap-embed.bin
          MINDMAP_EMBED_REF: ${{ runner.temp }}/embed/reference.json

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # The secrets of auto-updates are the environment mymind's.
    environment: mymind
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag matches the version in mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # With a Developer ID certificate in the repository's secrets, the app
      # is signed and the disk image notarized, so that macOS opens it
      # without asking; without, it is signed ad hoc, as before.
      #   APPLE_CERTIFICATE           the .p12 of "Developer ID Application", in base64
      #   APPLE_CERTIFICATE_PASSWORD  its password
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID     the Apple account and team
      #   APPLE_APP_PASSWORD          an app-specific password of the account
      # A self-signed certificate of code signing does too, with no Apple
      # account: then nothing is notarized, but every version is signed by
      # the same certificate, so that macOS keeps what it allowed the app,
      # as recording the screen, from version to version.
      - name: Set up signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing certificate: the app is signed ad hoc."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -z "$APPLE_ID" ]; then
            # Self-signed: trusted here for code signing, so that codesign
            # takes it; not notarized.
            security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$kc" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            security find-identity -v -p codesigning "$kc"
            echo "Signed with the certificate $APPLE_SIGNING_IDENTITY, not notarized."
            exit 0
          fi
          xcrun notarytool store-credentials mindmap-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
          jq --arg kc "$kc" '.macos.notarize = {keychainProfile: "mindmap-notary", keychain: $kc}' mygo.json > mygo.signed.json
          mv mygo.signed.json mygo.json
      - name: Open the draft of the update release
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release) && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="desktop-v$(jq -r .version mygo.json)"
          gh release view "$tag" --repo "$UPDATES_REPO" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$UPDATES_REPO" --draft --target main --title "MyMind $tag" --notes "MyMind $(jq -r .version mygo.json)"
          gh release view desktop-latest --repo "$UPDATES_REPO" >/dev/null 2>&1 ||
            gh release create desktop-latest --repo "$UPDATES_REPO" --target main --latest=false \
              --title "MyMind 自动更新" --notes "MyMind 的自动更新文件：应用从这里读取最新版本，请勿删除。"
      - name: Build MyMind.app and the disk image
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          ALL: ${{ startsWith(github.ref, 'refs/tags/') || inputs.all }}
        run: |
          # Apple silicon alone, unless all is asked (or a tag is pushed).
          platforms=darwin/arm64
          if [ "$ALL" = "true" ]; then
            platforms=darwin/arm64,darwin/amd64
          fi
          if [ -n "$SIGN_IDENTITY" ]; then
            go tool mygo build -platform "$platforms" -sign "$SIGN_IDENTITY"
          else
            go tool mygo build -platform "$platforms"
          fi
      - name: Publish the update files
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release) && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: bash .github/publish-updates.sh build/darwin-*
      - uses: actions/upload-artifact@v7
        with:
          name: MyMind-macOS
          path: build/*/*.dmg
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release create "$tag" build/*/*.dmg --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "MyMind $tag" \
            --notes-file .github/release-notes.md --generate-notes
      # Without the Windows job, which publishes it otherwise: the update
      # release of the apps before 0.30.1.
      - name: Publish the update release
        if: inputs.release && !inputs.all && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release edit "desktop-v$(jq -r .version mygo.json)" --repo "$UPDATES_REPO" --draft=false --latest=false

  # The Windows app and its installer, made on Windows (NSIS), added to the
  # release the macOS job publishes.
  windows:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && inputs.all
    runs-on: windows-latest
    # The secrets of auto-updates are the environment mymind's.
    environment: mymind
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build MyMind.exe and the installer
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
        run: |
          go tool mygo build -platform windows/amd64
      - name: Publish the update files
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release) && env.RELEASES_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: bash .github/publish-updates.sh build/windows-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: MyMind-Windows
          path: build/windows-amd64/*.exe
      - name: Add the installer to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release upload "$tag" build/windows-amd64/*Setup*.exe --repo "$GITHUB_REPOSITORY" --clobber
      # The apps check the newest desktop-v release: publishing the draft
      # offers the version to them. It stays off "latest", which is the
      # embedding model's.
      - name: Publish the update release
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release) && env.RELEASES_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release edit "desktop-v$(jq -r .version mygo.json)" --repo "$UPDATES_REPO" --draft=false --latest=false
